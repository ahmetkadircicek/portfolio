  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    /* The same font files the app loads, so they are fetched once. */
    @font-face {
      font-family: 'Instrument Sans'; font-weight: 500; font-display: swap;
      src: url(assets/assets/fonts/InstrumentSans-Medium.ttf) format('truetype');
    }
    @font-face {
      font-family: 'Geist Mono'; font-weight: 400; font-display: swap;
      src: url(assets/assets/fonts/GeistMono-Regular.ttf) format('truetype');
    }
    /* The greeting: the name and the role until the app's first frame, then
       it fades out. Matches the app's tokens (canvas, ink, inkSubtle, the
       sans for the name and the mono label for the role). */
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 0 24px;
      background: #ffffff; color: #1f2024; text-align: center;
      font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 15px;
      transition: opacity .5s cubic-bezier(.215, .61, .355, 1); z-index: 1;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader p { margin: 0; }
    #loader .hello { font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
    #loader .role {
      font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: .04em;
      text-transform: uppercase; line-height: 1.4; color: rgba(31, 32, 36, .62);
    }
    /* Text version of the site for search engines and screen readers;
       Flutter draws to a canvas, which neither can read. */
    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>
  <div id="loader" aria-hidden="true">
    <p class="hello"></p>
    <p class="role"></p>
  </div>
  <script>
    // The greeting in the language the app will open in: the address's
    // (/tr/...), else at / the visitor's last pick, else English. Texts are
    // Profile.name and Copy.pageTitleRole; test/loader_test.dart keeps them
    // in step.
    (function () {
      var texts = {
        en: ['Ahmet Kadir Çiçek', 'Mobile Developer'],
        tr: ['Ahmet Kadir Çiçek', 'Mobil Geliştirici']
      };
      var language = 'en';
      var first = location.pathname.split('/')[1];
      if (first === 'tr') {
        language = first;
      } else if (location.pathname === '/') {
        try {
          var saved = JSON.parse(localStorage.getItem('flutter.language'));
          if (texts[saved]) language = saved;
        } catch (e) {}
      }
      document.documentElement.lang = language;
      var loader = document.getElementById('loader');
      loader.querySelector('.hello').textContent = texts[language][0];
      loader.querySelector('.role').textContent = texts[language][1];
    })();
  </script>

  <!-- page:body: the page as text, also written per page. -->
  <main class="sr-only">
    <h1>Ahmet Kadir Çiçek — Mobile Developer</h1>
    <p>I like taking an app from a rough idea to a working product on my own: research, design and code.</p>
  </main>
  <!-- /page:body -->

  <noscript>This portfolio needs JavaScript. You can still <a href="/ahmet-kadir-cicek-cv.pdf">download my CV</a>.</noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 600);
    });
  </script>
  <script>
    // Earlier versions of this site installed a caching service worker that
    // keeps serving the old app from its cache. Remove it (once) before
    // loading Flutter; new visitors skip straight to loading.
    (async function () {
      try {
        var regs = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistrations() : [];
        if (regs.length && !sessionStorage.getItem('sw-cleaned')) {
          sessionStorage.setItem('sw-cleaned', '1');
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
          var keys = await caches.keys();
          await Promise.all(keys.filter(function (k) { return k.indexOf('flutter-') === 0; }).map(function (k) { return caches.delete(k); }));
          location.reload();
          return;
        }
      } catch (e) {}
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
